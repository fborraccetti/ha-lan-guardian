[project]
name = "lan-guardian"
version = "0.6.0"
description = "Home Assistant custom integration: LAN watchdog and Tasmota manager"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "TRY", "C4", "PIE", "PT"]
ignore = [
    "PLR0913", # HA callbacks have many arguments
    "PLR0917", # coordinators take hass, entry and their collaborators
    "PLR2004", # magic values are fine in tests and thresholds
    "TRY003",
    "TRY300",
    "PLR0911",
    "PLR0912",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["custom_components.lan_guardian"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["icmplib", "icmplib.*"]
ignore_missing_imports = true
