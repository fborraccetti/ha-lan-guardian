name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv venv -p 3.14 .venv
      - name: Install dependencies
        run: uv pip install -p .venv -r requirements_test.txt
      - name: Ruff
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .
      - name: Mypy
        run: .venv/bin/mypy
      - name: Pytest
        run: .venv/bin/pytest -q --cov=custom_components.lan_guardian --cov-report=term-missing
